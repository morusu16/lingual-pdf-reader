<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Left Page -->
  <rect x="88" y="140" width="156" height="232" rx="16" fill="#ffffff" />
  <!-- Text lines on left page -->
  <rect x="116" y="180" width="100" height="12" rx="6" fill="#cbd5e1" />
  <rect x="116" y="210" width="90" height="12" rx="6" fill="#cbd5e1" />
  <rect x="116" y="240" width="96" height="12" rx="6" fill="#cbd5e1" />
  <rect x="116" y="270" width="70" height="12" rx="6" fill="#cbd5e1" />
  <rect x="116" y="300" width="84" height="12" rx="6" fill="#cbd5e1" />

  <!-- Right Page -->
  <rect x="268" y="140" width="156" height="232" rx="16" fill="#ffffff" />
  <!-- Audio Speaker & Waves on right page -->
  <!-- Speaker Cone -->
  <path d="M 300 240 L 316 240 L 334 220 L 334 292 L 316 272 L 300 272 Z" fill="url(#waveGrad)" />
  <!-- Wave 1 -->
  <path d="M 352 236 C 362 246 362 266 352 276" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Wave 2 -->
  <path d="M 374 220 C 392 238 392 274 374 292" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Wave 3 -->
  <path d="M 396 204 C 422 230 422 282 396 308" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
</svg>
